aid: leapcure
name: Leapcure
description: >-
  Leapcure is a clinical-trial patient recruitment company whose mission is "where patient advocacy
  meets research" — connecting patients with clinical studies and helping research sites and sponsors
  reach and enroll participants. Leapcure was surfaced as a portfolio company of 500 Global and added
  to the API Evangelist network. The company publishes no product API of its own; the single
  machine-readable surface it operates is the WordPress REST API (wp/v2) behind its blog at
  blog.leapcure.com, which exposes read access to posts, pages, categories, tags, users, media,
  comments and search, plus authenticated write operations via WordPress application passwords. This
  profile was enriched by the API Evangelist pipeline from that live surface.
