openapi: 3.1.0
info:
  title: Leapcure Blog Content API (WordPress REST API)
  version: wp/v2
  description: Public content API for the Leapcure blog (blog.leapcure.com), served by the WordPress REST API `wp/v2`
    namespace. Read operations on posts, pages, categories, tags, users, media, comments, search, taxonomies, types
    and statuses were verified to respond anonymously on 2026-07-19; write operations require authentication via
    WordPress application passwords. This document was derived by the API Evangelist enrichment pipeline from the
    route metadata the server itself publishes at https://blog.leapcure.com/wp-json/wp/v2 — no operations, parameters
    or schemas were invented.
  contact:
    name: Leapcure
    email: info@leapcure.com
    url: https://leapcure.com/
servers:
- url: https://blog.leapcure.com/wp-json
  description: Leapcure blog WordPress REST API
security: []
components:
  securitySchemes:
    applicationPassword:
      type: http
      scheme: basic
      description: WordPress application passwords. Authorize at https://blog.leapcure.com/wp-admin/authorize-application.php
        (advertised in the /wp-json/ discovery document).
  schemas:
    Error:
      type: object
      description: WordPress REST API error envelope.
      properties:
        code:
          type: string
          description: Machine-readable error code, e.g. rest_forbidden.
        message:
          type: string
          description: Human-readable error message.
        data:
          type: object
          properties:
            status:
              type: integer
tags:
- name: categories
- name: comments
- name: media
- name: pages
- name: posts
- name: search
- name: statuses
- name: tags
- name: taxonomies
- name: types
- name: users
paths:
